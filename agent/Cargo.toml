# binario: arma las piezas y elige qué adaptador usar
[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
adapter = { version = "0.1.0", path = "adapter" }
anyhow = "1.0.104"
profiler-core = { version = "0.1.0", path = "profiler-core" }
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.8"
tonic-prost = "0.14.8"

[workspace]
resolver = "3"
members = ["profiler-core", "adapter"]

[build-dependencies]
tonic-prost-build = "0.14.8"
